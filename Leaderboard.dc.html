<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0}
  *{box-sizing:border-box}
  a{color:#4FCBBB;text-decoration:none}
  a:hover{color:#6fd8ca}
  .ry-scroll{overflow-y:auto;scrollbar-width:none}
  .ry-scroll::-webkit-scrollbar{display:none}
  @keyframes ryHdrIn{0%{opacity:0;transform:translateY(-8px)}100%{opacity:1;transform:none}}
  @keyframes ryRowIn{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}
  @keyframes ryBadgeIn{0%{opacity:0;transform:scale(.6)}60%{transform:scale(1.1)}100%{opacity:1;transform:scale(1)}}
  @keyframes ryYouGlow{0%,100%{box-shadow:inset 0 0 0 2px #4FCBBB,0 0 0 0 rgba(79,203,187,0)}50%{box-shadow:inset 0 0 0 2px #4FCBBB,0 0 16px 0 rgba(79,203,187,.35)}}
</style>
</helmet>
<div style="width:440px;height:956px;position:relative;overflow:hidden;background:#15161B;font-family:Nunito,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column">

  <!-- status bar -->
  <div style="height:54px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 26px;color:#fff;font-size:15px;font-weight:700;z-index:5">
    <span>9:41</span>
    <div style="display:flex;align-items:center;gap:7px">
      <div style="display:flex;align-items:flex-end;gap:2px;height:11px">
        <div style="width:3px;height:5px;background:#fff;border-radius:1px"></div>
        <div style="width:3px;height:7px;background:#fff;border-radius:1px"></div>
        <div style="width:3px;height:9px;background:#fff;border-radius:1px"></div>
        <div style="width:3px;height:11px;background:#fff;border-radius:1px"></div>
      </div>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 2.5c2 0 3.9.8 5.3 2.1l1.2-1.3A9.5 9.5 0 0 0 8 .8 9.5 9.5 0 0 0 1.5 3.3l1.2 1.3A7.5 7.5 0 0 1 8 2.5Zm0 3.4c1 0 2 .4 2.7 1.1l1.2-1.3A6 6 0 0 0 8 4.9a6 6 0 0 0-3.9 1.8l1.2 1.3A3.8 3.8 0 0 1 8 5.9Zm0 3.3-1.6 1.7L8 12l1.6-1.1L8 9.2Z" fill="#fff"/></svg>
      <div style="width:24px;height:12px;border:1.5px solid rgba(255,255,255,.5);border-radius:3px;padding:1.5px;position:relative">
        <div style="width:100%;height:100%;background:#fff;border-radius:1px"></div>
      </div>
    </div>
  </div>

  <!-- league header -->
  <div style="flex-shrink:0;padding:6px 20px 18px;text-align:center;animation:ryHdrIn .5s cubic-bezier(.2,.7,.2,1) both">
    <div style="display:flex;align-items:center;justify-content:center;gap:12px">
      <img src="assets/ic-trophy.svg" alt="" width="64" height="65" style="filter:drop-shadow(0 6px 14px rgba(240,165,0,.35));animation:ryBadgeIn .55s .1s cubic-bezier(.2,.8,.2,1) both" />
    </div>
    <h1 style="margin:12px 0 0;color:#fff;font-size:26px;font-weight:900;letter-spacing:-.4px">2026</h1>
    <p style="margin:6px 0 0;color:rgba(255,255,255,.5);font-size:14px;font-weight:700">Winner takes all &nbsp;·&nbsp; <span style="color:#4FCBBB">ends in {{ endsIn }}</span></p>
  </div>

  <!-- rankings -->
  <div class="ry-scroll" style="flex:1;min-height:0;padding:0 16px 8px">
    <sc-for list="{{ rows }}" as="r">
      <div style="{{ r.zoneLabelWrap }}">
        <div style="{{ r.zoneLine }}"></div>
        <span style="{{ r.zoneChip }}">{{ r.zoneText }}</span>
        <div style="{{ r.zoneLine }}"></div>
      </div>
      <button type="button" onClick="{{ r.onTap }}" style="{{ r.rowStyle }}" style-hover="background:#2b3049" style-active="transform:scale(.985)">
        <div style="width:30px;flex-shrink:0;display:flex;justify-content:center">
          <div style="{{ r.rankBadge }}">{{ r.rankText }}</div>
        </div>
        <div style="{{ r.avatarStyle }}">{{ r.monogram }}</div>
        <div style="flex:1;min-width:0;text-align:left">
          <div style="display:flex;align-items:center;gap:7px">
            <span style="color:#fff;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.name }}</span>
            <span style="{{ r.youTag }}">YOU</span>
          </div>
          <div style="color:rgba(255,255,255,.4);font-size:12.5px;font-weight:700;margin-top:1px">{{ r.members }} racers</div>
        </div>
        <div style="{{ r.deltaStyle }}">
          <span style="{{ r.deltaArrow }}">{{ r.deltaGlyph }}</span>{{ r.deltaText }}
        </div>
        <div style="display:flex;align-items:center;gap:5px;flex-shrink:0;width:86px;justify-content:flex-end">
          <img src="assets/ic-points.svg" alt="" width="15" height="19" style="display:block" />
          <span style="color:#fff;font-size:16px;font-weight:900;font-variant-numeric:tabular-nums">{{ r.pts }}</span>
        </div>
      </button>
    </sc-for>
    <div style="height:6px"></div>
  </div>

  <!-- bottom nav -->
  <div style="flex-shrink:0;height:82px;background:#1b1e2b;border-top:1px solid #2a3047;display:flex;align-items:stretch;padding:0 6px 14px">
    <sc-for list="{{ tabs }}" as="t">
      <button type="button" onClick="{{ t.onTap }}" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;border:0;cursor:pointer;font-family:inherit" style-active="transform:translateY(1px)">
        <div style="{{ t.iconWrap }}">{{ t.iconEl }}</div>
        <span style="{{ t.labelStyle }}">{{ t.label }}</span>
      </button>
    </sc-for>
  </div>

  <div style="{{ toastStyle }}">{{ toastText }}</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:440,&quot;height&quot;:956}}">
const TEAMS = [
  { name: "Redline Runners", members: 6, pts: 4820, color: "#E0576B", delta: 2 },
  { name: "The Cartographers", members: 5, pts: 4610, color: "#F0A500", delta: 0 },
  { name: "Night Owls", members: 6, pts: 4390, color: "#7F60DC", delta: 3 },
  { name: "River Rats", members: 4, pts: 4155, color: "#4C9BE0", delta: -1 },
  { name: "Loop Wolves", members: 5, pts: 3980, color: "#4FCBBB", delta: 1, you: true },
  { name: "Asphalt Foxes", members: 5, pts: 3720, color: "#E08A3C", delta: -2 },
  { name: "Gridlock Gang", members: 6, pts: 3510, color: "#9B6BD6", delta: 0 },
  { name: "Detour Crew", members: 4, pts: 3240, color: "#5BC0A8", delta: 4 },
  { name: "Pit Vipers", members: 5, pts: 2990, color: "#C7566B", delta: -3 },
  { name: "Backseat Bandits", members: 3, pts: 2610, color: "#6E86C7", delta: -1 },
];
const PROMOTE = 5, DEMOTE = 8; // top 5 advance; bottom 2 (index >= 8) drop
const ICON = {
  home: "assets/nav-home.svg",
  challenges: "assets/nav-challenges.svg",
  map: "assets/nav-map.svg",
  board: "assets/nav-league.svg",
  profile: "assets/nav-profile.svg",
};
class Component extends DCLogic {
  state = { prog: 0, active: "board", toast: null };
  componentDidMount() {
    const t0 = performance.now(), dur = 1100;
    const tick = (t) => {
      const p = Math.min(1, (t - t0) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      this.setState({ prog: e });
      if (p < 1) this._raf = requestAnimationFrame(tick);
    };
    this._raf = requestAnimationFrame(tick);
  }
  componentWillUnmount() { cancelAnimationFrame(this._raf); clearTimeout(this._tt); }
  ping(msg) { this.setState({ toast: msg }); clearTimeout(this._tt); this._tt = setTimeout(() => this.setState({ toast: null }), 2000); }
  monogram(n) { const w = n.split(" "); return (w[0][0] + (w[1] ? w[1][0] : "")).toUpperCase(); }
  renderVals() {
    const st = this.state;
    const medal = ["#F0A500", "#C7CCD6", "#C1834A"];
    const rows = TEAMS.map((tm, i) => {
      const rank = i + 1;
      const promote = rank <= PROMOTE;
      const demote = i >= DEMOTE;
      const isTop3 = i < 3;
      const zone = null;
      const zoneColor = "#4FCBBB";
      const base = tm.you
        ? "background:rgba(79,203,187,.08);animation:ryYouGlow 2.6s ease-in-out infinite"
        : "background:#23273B";
      const rankBadge = isTop3
        ? `width:26px;height:26px;border-radius:50%;background:${medal[i]};color:#15161B;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 rgba(0,0,0,.25)`
        : `color:${promote ? "#4FCBBB" : "rgba(255,255,255,.55)"};font-size:16px;font-weight:900`;
      const d = tm.delta;
      const dColor = d > 0 ? "#4FCBBB" : (d < 0 ? "#E0576B" : "rgba(255,255,255,.35)");
      return {
        onTap: () => this.ping(tm.you ? "That's your crew \u2014 keep climbing!" : tm.name + " \u00b7 " + tm.pts.toLocaleString() + " pts"),
        rowStyle: `position:relative;width:100%;display:flex;align-items:center;gap:12px;padding:11px 14px 11px 8px;border:0;border-radius:16px;cursor:pointer;font-family:inherit;margin-bottom:8px;transition:background .12s,transform .08s;animation:ryRowIn .4s cubic-bezier(.2,.7,.2,1) ${(0.05 + i * 0.045).toFixed(2)}s both;${base}`,
        rankBadge, rankText: String(rank),
        avatarStyle: `width:40px;height:40px;border-radius:50%;flex-shrink:0;background:${tm.color};color:#15161B;font-size:15px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(0,0,0,.28)`,
        monogram: this.monogram(tm.name),
        name: tm.name,
        members: tm.members,
        youTag: `display:${tm.you ? "inline-block" : "none"};background:#4FCBBB;color:#15161B;font-size:10px;font-weight:900;letter-spacing:.5px;padding:2px 6px;border-radius:6px`,
        pts: Math.round(tm.pts * st.prog).toLocaleString(),
        deltaStyle: `display:flex;align-items:center;gap:2px;color:${dColor};font-size:12.5px;font-weight:900;width:30px;justify-content:flex-end`,
        deltaArrow: `font-size:11px;line-height:1;display:${d === 0 ? "none" : "inline"}`,
        deltaGlyph: d > 0 ? "\u25B2" : "\u25BC",
        deltaText: d === 0 ? "\u2013" : String(Math.abs(d)),
        // zone divider (rendered above the row it labels)
        zoneLabelWrap: `display:${zone ? "flex" : "none"};align-items:center;gap:10px;margin:2px 4px 12px`,
        zoneLine: `flex:1;height:2px;border-radius:2px;background:repeating-linear-gradient(90deg,${zoneColor} 0 7px,transparent 7px 13px);opacity:.5`,
        zoneChip: `color:${zoneColor};font-size:11px;font-weight:900;letter-spacing:.8px;white-space:nowrap`,
        zoneText: zone || "",
      };
    });
    const tabDefs = [
      { id: "home", label: "Home", icon: ICON.home },
      { id: "challenges", label: "Challenges", icon: ICON.challenges },
      { id: "map", label: "Map", icon: ICON.map },
      { id: "board", label: "League", icon: ICON.board },
      { id: "profile", label: "Profile", icon: ICON.profile },
    ];
    const tabs = tabDefs.map(t => {
      const on = st.active === t.id;
      return {
        onTap: () => { this.setState({ active: t.id }); if (t.id !== "board") this.ping(t.label + " \u2192"); },
        iconEl: React.createElement("img", { src: t.icon, alt: "", style: { maxWidth: "30px", maxHeight: "28px", width: "auto", height: "auto", display: "block", transition: "filter .2s,opacity .2s", filter: on ? "none" : "grayscale(1)", opacity: on ? 1 : 0.5 } }),
        iconWrap: `display:flex;align-items:center;justify-content:center;height:30px`,
        label: t.label,
        labelStyle: `font-size:10.5px;font-weight:800;color:${on ? "#4FCBBB" : "#5b6178"};letter-spacing:.2px`,
      };
    });
    return {
      endsIn: "2d 14h",
      arrowStyle: "background:none;border:0;color:#4b5168;cursor:pointer;padding:8px;display:flex;transition:color .15s",
      onPrevLeague: () => this.ping("Silver \u00b7 Uptown Division"),
      onNextLeague: () => this.ping("You're in the top division \ud83c\udfc1"),
      rows, tabs,
      toastText: st.toast || "",
      toastStyle: `position:absolute;left:50%;bottom:104px;transform:translateX(-50%) translateY(${st.toast ? "0" : "8px"});opacity:${st.toast ? 1 : 0};transition:all .25s;pointer-events:none;background:#2b3049;color:#fff;font-weight:800;font-size:13px;padding:10px 18px;border-radius:22px;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:20`,
    };
  }
}
</script>
</body>
</html>
