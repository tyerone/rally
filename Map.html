<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rally · Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>
  html,body{margin:0}
  *{box-sizing:border-box}
  #frame{width:440px;height:956px;position:relative;overflow:hidden;background:#15161B;font-family:Nunito,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  #map{position:absolute;inset:0;background:#15161B;z-index:0}
  .leaflet-tile{filter:invert(1) hue-rotate(180deg) brightness(.82) contrast(.92) saturate(.45) grayscale(.4)}
  .leaflet-container{background:#12131a;font-family:inherit}
  .leaflet-control-attribution{background:rgba(21,22,27,.7)!important;color:rgba(255,255,255,.35)!important;font-size:9px!important}
  .leaflet-control-attribution a{color:rgba(255,255,255,.5)!important}
  .ry-scroll::-webkit-scrollbar{width:0;height:0}
  .ry-scroll{scrollbar-width:none}
  /* checkpoint pin */
  .cp{background:none;border:0}
  .cp-inner{width:38px;height:38px;border-radius:50% 50% 50% 4px;transform:rotate(45deg);display:flex;align-items:center;justify-content:center;border:2.5px solid #15161B;box-shadow:0 5px 12px rgba(0,0,0,.5)}
  .cp-inner span{transform:rotate(-45deg);font-weight:900;font-size:15px;color:#15161B}
  .cp-me{width:44px;height:44px;border-radius:50%;background:#4FCBBB;border:3px solid #15161B;box-shadow:0 0 0 6px rgba(79,203,187,.25),0 4px 10px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .cp-me img{width:34px;height:34px;display:block}
  /* popup */
  .leaflet-popup-content-wrapper{background:#1c1f2e;color:#fff;border:1px solid #343A56;border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
  .leaflet-popup-content{margin:13px 15px;font-family:Nunito,sans-serif}
  .leaflet-popup-tip{background:#1c1f2e;border:1px solid #343A56}
  .leaflet-popup-close-button{color:rgba(255,255,255,.5)!important}
  .pop-name{font-size:15px;font-weight:900;letter-spacing:-.2px}
  .pop-sub{font-size:12px;font-weight:700;margin-top:3px}
</style>
</head>
<body>
<div id="frame">
  <div id="map"></div>

  <!-- top overlay -->
  <div style="position:absolute;top:0;left:0;right:0;z-index:500;padding:22px 20px 30px;background:linear-gradient(180deg,rgba(21,22,27,.92) 0%,rgba(21,22,27,.7) 55%,rgba(21,22,27,0) 100%);pointer-events:none;text-align:center">
    <div style="color:#fff;font-size:24px;font-weight:900;letter-spacing:-.4px">Map</div>
    <div style="display:flex;align-items:center;justify-content:center;gap:7px;margin-top:5px">
      <span style="width:8px;height:8px;border-radius:50%;background:#4FCBBB;box-shadow:0 0 0 3px rgba(79,203,187,.25)"></span>
      <span style="color:rgba(255,255,255,.6);font-size:13px;font-weight:800">7 checkpoints live tonight</span>
    </div>
  </div>

  <!-- recenter -->
  <button id="recenter" type="button" style="position:absolute;right:16px;bottom:352px;z-index:500;width:46px;height:46px;border-radius:14px;background:#1b1e2b;border:1px solid #2a3047;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.4)">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 3v2m0 14v2m9-9h-2M5 12H3" stroke="#4FCBBB" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="12" r="5.5" stroke="#4FCBBB" stroke-width="2.2"/><circle cx="12" cy="12" r="1.6" fill="#4FCBBB"/></svg>
  </button>

  <!-- bottom sheet -->
  <div style="position:absolute;left:0;right:0;bottom:82px;z-index:500;height:270px;background:#1b1e2b;border-top:1px solid #2a3047;border-radius:24px 24px 0 0;display:flex;flex-direction:column;box-shadow:0 -16px 40px rgba(0,0,0,.45)">
    <div style="flex-shrink:0;padding:12px 20px 8px">
      <div style="width:44px;height:5px;border-radius:3px;background:#3a4160;margin:0 auto 14px"></div>
      <div style="color:rgba(255,255,255,.5);font-size:12px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase">Stations</div>
    </div>
    <div id="cplist" class="ry-scroll" style="flex:1;min-height:0;overflow-y:auto;padding:2px 14px 16px;display:flex;flex-direction:column;gap:9px"></div>
  </div>

  <!-- bottom nav -->
  <div style="position:absolute;left:0;right:0;bottom:0;z-index:600;height:82px;background:#1b1e2b;border-top:1px solid #2a3047;display:flex;align-items:stretch;padding:0 6px 14px" id="nav"></div>

  <!-- toast -->
  <div id="toast" style="position:absolute;left:50%;bottom:372px;transform:translateX(-50%) translateY(8px);background:#23273B;border:1px solid #343A56;color:#fff;font-weight:800;font-size:13px;padding:10px 18px;border-radius:22px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:700;white-space:nowrap"></div>
</div>

<script>
const CENTER = [49.278, -122.818];
const CHECKPOINTS = [
  { name: "Lafarge Lake",        area: "Coquitlam",   n: 4, color: "#4FCBBB", lat: 49.2846, lng: -122.7932 },
  { name: "Rocky Point Park",    area: "Port Moody",  n: 5, color: "#7F60DC", lat: 49.2860, lng: -122.8560 },
  { name: "Coquitlam Centre",    area: "Coquitlam",   n: 3, color: "#F8C949", lat: 49.2790, lng: -122.7960 },
  { name: "Como Lake Park",      area: "Coquitlam",   n: 3, color: "#FF6B6B", lat: 49.2560, lng: -122.8460 },
  { name: "Brewers Row",         area: "Port Moody",  n: 4, color: "#E0A46B", lat: 49.2795, lng: -122.8480 },
  { name: "Mundy Park",          area: "Coquitlam",   n: 2, color: "#5BC0A8", lat: 49.2660, lng: -122.8300 },
  { name: "Town Centre Park",    area: "Coquitlam",   n: 5, color: "#4C9BE0", lat: 49.2810, lng: -122.7890 },
];

const map = L.map('map', { zoomControl: false, attributionControl: true }).setView(CENTER, 13);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors', maxZoom: 19
}).addTo(map);

// "you are here" pulse
L.marker(CENTER, { icon: L.divIcon({ className: 'cp', html: '<div class="cp-me"><img src="assets/nav-profile.svg" alt=""></div>', iconSize: [44,44], iconAnchor: [22,22] }), zIndexOffset: 400 })
  .addTo(map).bindPopup('<div class="pop-name">You & the crew</div><div class="pop-sub" style="color:#4FCBBB">Loop Wolves · 3,980 pts</div>');

const markers = {};
CHECKPOINTS.forEach((c, i) => {
  const icon = L.divIcon({
    className: 'cp',
    html: `<div class="cp-inner" style="background:${c.color}"><span>${c.n}</span></div>`,
    iconSize: [38,38], iconAnchor: [19,36], popupAnchor: [0,-34]
  });
  const m = L.marker([c.lat, c.lng], { icon }).addTo(map)
    .bindPopup(`<div class="pop-name">${c.name}</div><div class="pop-sub" style="color:${c.color}">${c.n} challenges · ${c.area}</div>`);
  markers[i] = m;
});

// list
const list = document.getElementById('cplist');
CHECKPOINTS.forEach((c, i) => {
  const row = document.createElement('button');
  row.type = 'button';
  row.style.cssText = 'display:flex;align-items:center;gap:13px;background:#23273B;border:1px solid #2a3047;border-radius:15px;padding:12px 14px;cursor:pointer;font-family:inherit;text-align:left;transition:transform .06s';
  row.onmousedown = () => row.style.transform = 'translateY(1px)';
  row.onmouseup = row.onmouseleave = () => row.style.transform = 'none';
  row.innerHTML = `
    <div style="width:40px;height:40px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:${c.color}22">
      <span style="color:${c.color};font-size:17px;font-weight:900">${c.n}</span>
    </div>
    <div style="flex:1;min-width:0">
      <div style="color:#fff;font-size:15.5px;font-weight:900">${c.name}</div>
      <div style="color:rgba(255,255,255,.5);font-size:12.5px;font-weight:700;margin-top:1px">${c.n} challenges · ${c.area}</div>
    </div>
    <svg width="9" height="16" viewBox="0 0 11 18" fill="none"><path d="M1.5 1.5L9 9l-7.5 7.5" stroke="#5b6178" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  row.onclick = () => { map.flyTo([c.lat, c.lng], 15, { duration: .8 }); markers[i].openPopup(); };
  list.appendChild(row);
});

document.getElementById('recenter').onclick = () => map.flyTo(CENTER, 13, { duration: .8 });

// nav (Map active)
const NAV = [
  { id:'home', label:'Home', icon:'assets/nav-home.svg' },
  { id:'challenges', label:'Challenges', icon:'assets/nav-challenges.svg' },
  { id:'map', label:'Map', icon:'assets/nav-map.svg' },
  { id:'board', label:'League', icon:'assets/nav-league.svg' },
  { id:'profile', label:'Profile', icon:'assets/nav-profile.svg' },
];
const nav = document.getElementById('nav');
const toast = document.getElementById('toast');
let toastT;
function ping(msg){ clearTimeout(toastT); toast.textContent = msg; toast.style.opacity='1'; toast.style.transform='translateX(-50%) translateY(0)'; toastT = setTimeout(()=>{ toast.style.opacity='0'; toast.style.transform='translateX(-50%) translateY(8px)'; }, 1600); }
NAV.forEach(t => {
  const on = t.id === 'map';
  const b = document.createElement('button');
  b.type = 'button';
  b.style.cssText = 'flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;border:0;cursor:pointer;font-family:inherit';
  b.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:30px"><img src="${t.icon}" alt="" style="max-width:30px;max-height:28px;width:auto;height:auto;display:block;filter:${on?'none':'grayscale(1)'};opacity:${on?1:.5}"></div>
    <span style="font-size:10.5px;font-weight:800;color:${on?'#4FCBBB':'#5b6178'};letter-spacing:.2px">${t.label}</span>`;
  b.onclick = () => { if(!on) ping(t.label + ' \u2192'); };
  nav.appendChild(b);
});

setTimeout(() => map.invalidateSize(), 200);
</script>
</body>
</html>
