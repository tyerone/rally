<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,700;0,800;0,900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0}
  a{color:#4FCBBB;text-decoration:none}
  a:hover{color:#6fd8ca}
  @keyframes rallyLogoIn{0%{opacity:0;transform:translateY(14px) scale(.96)}100%{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes rallyBtnsIn{0%{opacity:0;transform:translateY(22px)}100%{opacity:1;transform:translateY(0)}}
</style>
</helmet>
<div style="width:440px;height:956px;position:relative;overflow:hidden;background:#15161B;font-family:Nunito,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased">

  <div style="position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;box-sizing:border-box;color:#fff;font-size:15px;font-weight:700;z-index:5">
    <span>9:41</span>
    <div style="display:flex;align-items:center;gap:7px">
      <div style="display:flex;align-items:flex-end;gap:2px;height:11px">
        <div style="width:3px;height:5px;background:#fff;border-radius:1px"></div>
        <div style="width:3px;height:7px;background:#fff;border-radius:1px"></div>
        <div style="width:3px;height:9px;background:#fff;border-radius:1px"></div>
        <div style="width:3px;height:11px;background:#fff;border-radius:1px"></div>
      </div>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 2.5c2 0 3.9.8 5.3 2.1l1.2-1.3A9.5 9.5 0 0 0 8 .8 9.5 9.5 0 0 0 1.5 3.3l1.2 1.3A7.5 7.5 0 0 1 8 2.5Zm0 3.4c1 0 2 .4 2.7 1.1l1.2-1.3A6 6 0 0 0 8 4.9a6 6 0 0 0-3.9 1.8l1.2 1.3A3.8 3.8 0 0 1 8 5.9Zm0 3.3-1.6 1.7L8 12l1.6-1.1L8 9.2Z" fill="#fff"/></svg>
      <div style="width:24px;height:12px;border:1.5px solid rgba(255,255,255,.5);border-radius:3px;padding:1.5px;box-sizing:border-box;position:relative">
        <div style="width:100%;height:100%;background:#fff;border-radius:1px"></div>
        <div style="position:absolute;right:-3px;top:3.5px;width:2px;height:5px;background:rgba(255,255,255,.5);border-radius:0 1px 1px 0"></div>
      </div>
    </div>
  </div>

  <div style="position:absolute;left:0;top:352px;width:440px;display:flex;align-items:center;justify-content:center;gap:12px;animation:rallyLogoIn .7s cubic-bezier(.2,.7,.2,1) both">
    <img src="assets/rally-logo.svg" alt="Rally" width="60" height="49" style="display:block" />
    <span style="font-weight:800;font-size:48.28px;line-height:1;color:#4FCBBB;letter-spacing:-.5px">rally</span>
  </div>

  <div style="position:absolute;left:0;top:816px;width:440px;height:140px;display:flex;flex-direction:column;gap:12px;padding:0 16px;box-sizing:border-box;animation:rallyBtnsIn .7s .25s cubic-bezier(.2,.7,.2,1) both">
    <button type="button" onClick="{{ onGetStarted }}" style="{{ primaryStyle }}" style-active="transform:translateY(4px);box-shadow:0px 0px 0px 0px #379488" style-hover="background:#5ad3c3">
      <span style="font-weight:800;font-size:13.48px;line-height:1;letter-spacing:.8px;color:#fff;text-transform:uppercase">get started</span>
    </button>
    <button type="button" onClick="{{ onSignIn }}" style="{{ secondaryStyle }}" style-active="transform:translateY(2px);box-shadow:inset 0 0 0 2px #364348" style-hover="background:rgba(79,203,187,.06);box-shadow:inset 0 0 0 2px #4a5b61,0px 2px 0px 0px #364348">
      <span style="font-weight:800;font-size:13.48px;line-height:1;letter-spacing:.8px;color:rgba(255,255,255,.82);text-transform:uppercase">I already have an account</span>
    </button>
  </div>

  <div style="{{ toastStyle }}">{{ toastText }}</div>

  <div style="position:absolute;left:50%;bottom:9px;transform:translateX(-50%);width:140px;height:5px;border-radius:3px;background:rgba(255,255,255,.35)"></div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:440,&quot;height&quot;:956},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#4FCBBB&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#4FCBBB&quot;,&quot;#58CC02&quot;,&quot;#F0A500&quot;,&quot;#FF5A5F&quot;]}}">
class Component extends DCLogic {
  state = { toast: null };
  ping(msg) {
    this.setState({ toast: msg });
    clearTimeout(this._t);
    this._t = setTimeout(() => this.setState({ toast: null }), 1900);
  }
  renderVals() {
    const accent = this.props.accent ?? "#4FCBBB";
    return {
      onGetStarted: () => this.ping("Starting sign-up \u2192"),
      onSignIn: () => this.ping("Welcome back \u2192"),
      primaryStyle: `position:relative;height:46px;flex-shrink:0;align-self:stretch;border:0;border-radius:12px;background:${accent};box-shadow:0px 4px 0px 0px #379488;display:flex;gap:10px;padding:10px;justify-content:center;align-items:center;box-sizing:border-box;cursor:pointer;font-family:inherit;transition:transform .06s ease,box-shadow .06s ease,background .15s ease`,
      secondaryStyle: "position:relative;height:46px;flex-shrink:0;align-self:stretch;border:0;border-radius:12px;background:transparent;box-shadow:inset 0 0 0 2px #364348,0px 2px 0px 0px #364348;display:flex;gap:10px;padding:10px;justify-content:center;align-items:center;box-sizing:border-box;cursor:pointer;font-family:inherit;transition:transform .06s ease,box-shadow .06s ease,background .15s ease",
      toastText: this.state.toast || "",
      toastStyle: `position:absolute;left:50%;top:740px;transform:translateX(-50%) translateY(${this.state.toast ? "0" : "8px"});opacity:${this.state.toast ? "1" : "0"};transition:opacity .25s ease,transform .25s ease;pointer-events:none;background:rgba(79,203,187,.14);color:#4FCBBB;font-weight:800;font-size:13px;letter-spacing:.4px;padding:9px 16px;border-radius:20px;white-space:nowrap`,
    };
  }
}
</script>
</body>
</html>
